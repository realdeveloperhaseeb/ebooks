<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebook Landing Wireframe</title>
<style>
  :root{
    --bg:#f4f4f5;
    --block:#d4d4d8;
    --block-dark:#a1a1aa;
    --line:#e4e4e7;
    --card:#ffffff;
    --gap:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:system-ui,sans-serif;color:#000}

  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  section{padding:56px 0;border-bottom:1px dashed var(--block-dark)}
  .row{display:grid;gap:var(--gap)}
  .c2{grid-template-columns:repeat(2,1fr)}
  .c3{grid-template-columns:repeat(3,1fr)}
  .c4{grid-template-columns:repeat(4,1fr)}
  .center{justify-items:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  .stack.mid{align-items:center}

  /* primitives */
  .bar{height:14px;background:var(--block);border-radius:4px;width:100%}
  .bar.h1{height:34px;background:var(--block-dark)}
  .bar.h2{height:26px;background:var(--block-dark)}
  .bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w30{width:30%}
  .btn{height:52px;width:220px;background:var(--block-dark);border-radius:8px}
  .btn.lg{width:280px}
  .btn.ghost{background:transparent;border:2px solid var(--block-dark)}
  .pill{height:36px;width:110px;background:var(--block);border-radius:999px}
  .circle{width:48px;height:48px;border-radius:50%;background:var(--block-dark);flex:none}
  .circle.sm{width:28px;height:28px}
  .square{width:28px;height:28px;border-radius:6px;background:var(--block);flex:none}
  .img{background:var(--block);border-radius:10px;position:relative;overflow:hidden}
  .img::before,.img::after{content:"";position:absolute;left:50%;top:50%;width:140%;height:2px;background:var(--block-dark);opacity:.5;transform:translate(-50%,-50%) rotate(35deg)}
  .img::after{transform:translate(-50%,-50%) rotate(-35deg)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  .headline{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:36px}
  .headline .bar{margin:0 auto}
  .line-item{display:flex;align-items:center;gap:14px}
  .line-item .bar{flex:1}
  .strip{display:flex;gap:16px;flex-wrap:wrap}
  .strip .pill{width:90px;height:28px}

  /* 1 hero */
  .hero{min-height:560px;display:flex;align-items:center}
  .hero .row{align-items:center}
  .cover{aspect-ratio:3/4;max-width:340px;margin:0 auto;width:100%}
  .price{display:flex;align-items:center;gap:14px}
  .price .old{height:18px;width:70px;background:var(--block);border-radius:4px}
  .price .new{height:34px;width:110px;background:var(--block-dark);border-radius:6px}

  /* 2 pain */
  .pain .card{display:flex;flex-direction:column;gap:14px;align-items:flex-start}

  /* 3 inside */
  .grid-6{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:var(--gap)}
  .pages{aspect-ratio:3/4}
  .capture{display:flex;flex-direction:column;gap:14px;justify-content:center}
  .input{height:46px;border:2px solid var(--block);border-radius:8px;background:#fff}

  /* 4 roadmap */
  .timeline{display:flex;flex-direction:column;gap:20px;position:relative;padding-left:8px}
  .timeline::before{content:"";position:absolute;left:30px;top:10px;bottom:10px;width:3px;background:var(--block)}
  .timeline .line-item{position:relative}

  /* 5 proof */
  .person{display:flex;align-items:center;gap:12px;margin-top:6px}
  .person .stack{flex:1}
  .stars{display:flex;gap:6px}
  .stars span{width:18px;height:18px;background:var(--block-dark);border-radius:3px}
  .author{margin-top:var(--gap);display:grid;grid-template-columns:160px 1fr;gap:var(--gap);align-items:center}
  .author .img{aspect-ratio:1/1;border-radius:50%}

  /* 6 pricing */
  .price-card{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:center;border:2px solid var(--block-dark)}
  .price-card .cover-s{width:140px;aspect-ratio:3/4}
  .pay{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
  .pay span{height:40px;background:var(--block);border-radius:6px}
  .badge{width:72px;height:72px;border-radius:50%;border:4px solid var(--block-dark)}
  .price-card .list{width:100%;display:flex;flex-direction:column;gap:12px}

  /* 7 faq */
  .faq{max-width:760px;margin:0 auto 40px;display:flex;flex-direction:column;gap:12px}
  .faq .item{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .faq .item .bar{width:55%}
  .faq .item .square{width:22px;height:22px}
  .final{padding:48px 24px;border-radius:14px;background:var(--block);display:flex;flex-direction:column;align-items:center;gap:16px}

  /* 8 footer */
  footer{padding:48px 0;background:#e9e9ec}
  footer .stack .bar{height:12px}

  /* floating whatsapp */
  .float{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;background:var(--block-dark);border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}

  /* responsive */
  @media(max-width:820px){
    .c2,.c3,.c4{grid-template-columns:1fr}
    .grid-6{grid-template-columns:1fr 1fr}
    .author{grid-template-columns:1fr}
    .hero{min-height:0}
    section{padding:40px 0}
  }
  @media(max-width:480px){
    .grid-6{grid-template-columns:1fr}
    .btn,.btn.lg{width:100%}
  }
</style>
</head>
<body>

<!-- 1. HERO -->
<section class="hero">
  <div class="wrap" style="width:100%">
    <div class="row c2">
      <div class="stack" style="gap:18px">
        <div class="bar h1"></div>
        <div class="bar h1 w80"></div>
        <div class="bar w80"></div>
        <div class="bar w60"></div>
        <div class="price"><div class="old"></div><div class="new"></div></div>
        <div class="btn lg"></div>
        <div class="strip"><span class="pill"></span><span class="pill"></span><span class="pill"></span></div>
      </div>
      <div class="img cover"></div>
    </div>
  </div>
</section>

<!-- 2. PAIN POINTS -->
<section class="pain">
  <div class="wrap">
    <div class="headline"><div class="bar h2" style="width:50%"></div><div class="bar w40"></div></div>
    <div class="row c3">
      <div class="card"><div class="circle"></div><div class="bar"></div><div class="bar w80"></div><div class="bar w60"></div></div>
      <div class="card"><div class="circle"></div><div class="bar"></div><div class="bar w80"></div><div class="bar w60"></div></div>
      <div class="card"><div class="circle"></div><div class="bar"></div><div class="bar w80"></div><div class="bar w60"></div></div>
    </div>
    <div class="stack mid" style="margin-top:32px"><div class="bar w60"></div></div>
  </div>
</section>

<!-- 3. WHAT'S INSIDE -->
<section>
  <div class="wrap">
    <div class="headline"><div class="bar h2" style="width:45%"></div><div class="bar w40"></div></div>
    <div class="grid-6">
      <div class="card stack"><div class="circle"></div><div class="bar"></div><div class="bar w60"></div></div>
      <div class="card stack"><div class="circle"></div><div class="bar"></div><div class="bar w60"></div></div>
      <div class="card stack"><div class="circle"></div><div class="bar"></div><div class="bar w60"></div></div>
      <div class="card stack"><div class="circle"></div><div class="bar"></div><div class="bar w60"></div></div>
      <div class="card stack"><div class="circle"></div><div class="bar"></div><div class="bar w60"></div></div>
      <div class="card stack"><div class="circle"></div><div class="bar"></div><div class="bar w60"></div></div>
    </div>
    <div class="row c4" style="align-items:stretch">
      <div class="img pages"></div>
      <div class="img pages"></div>
      <div class="img pages"></div>
      <div class="card capture">
        <div class="bar h2 w80"></div>
        <div class="input"></div>
        <div class="btn" style="width:100%"></div>
      </div>
    </div>
  </div>
</section>

<!-- 4. WHO IT'S FOR + ROADMAP -->
<section>
  <div class="wrap">
    <div class="row c2">
      <div class="card stack" style="gap:20px">
        <div class="bar h2 w60"></div>
        <div class="line-item"><div class="square"></div><div class="bar"></div></div>
        <div class="line-item"><div class="square"></div><div class="bar w80"></div></div>
        <div class="line-item"><div class="square"></div><div class="bar"></div></div>
        <div class="line-item"><div class="square"></div><div class="bar w60"></div></div>
      </div>
      <div class="card stack" style="gap:20px">
        <div class="bar h2 w60"></div>
        <div class="timeline">
          <div class="line-item"><div class="circle sm"></div><div class="bar"></div></div>
          <div class="line-item"><div class="circle sm"></div><div class="bar w80"></div></div>
          <div class="line-item"><div class="circle sm"></div><div class="bar"></div></div>
          <div class="line-item"><div class="circle sm"></div><div class="bar w60"></div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 5. SOCIAL PROOF -->
<section>
  <div class="wrap">
    <div class="headline"><div class="bar h2" style="width:40%"></div></div>
    <div class="row c3">
      <div class="card stack">
        <div class="stars"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="bar"></div><div class="bar"></div><div class="bar w60"></div>
        <div class="person"><div class="circle"></div><div class="stack" style="gap:8px"><div class="bar w60"></div><div class="bar w40"></div></div></div>
      </div>
      <div class="card stack">
        <div class="stars"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="bar"></div><div class="bar"></div><div class="bar w60"></div>
        <div class="person"><div class="circle"></div><div class="stack" style="gap:8px"><div class="bar w60"></div><div class="bar w40"></div></div></div>
      </div>
      <div class="card stack">
        <div class="stars"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="bar"></div><div class="bar"></div><div class="bar w60"></div>
        <div class="person"><div class="circle"></div><div class="stack" style="gap:8px"><div class="bar w60"></div><div class="bar w40"></div></div></div>
      </div>
    </div>
    <div class="card author">
      <div class="img"></div>
      <div class="stack"><div class="bar h2 w40"></div><div class="bar"></div><div class="bar w80"></div><div class="bar w60"></div></div>
    </div>
  </div>
</section>

<!-- 6. PRICING / OFFER -->
<section>
  <div class="wrap">
    <div class="card price-card">
      <div class="img cover-s"></div>
      <div class="price"><div class="old"></div><div class="new"></div></div>
      <div class="list">
        <div class="line-item"><div class="square"></div><div class="bar"></div></div>
        <div class="line-item"><div class="square"></div><div class="bar w80"></div></div>
        <div class="line-item"><div class="square"></div><div class="bar"></div></div>
        <div class="line-item"><div class="square"></div><div class="bar w60"></div></div>
      </div>
      <div class="pay"><span></span><span></span><span></span><span></span></div>
      <div class="btn lg" style="width:100%"></div>
      <div class="badge"></div>
    </div>
  </div>
</section>

<!-- 7. FAQ + FINAL CTA -->
<section>
  <div class="wrap">
    <div class="headline"><div class="bar h2" style="width:30%"></div></div>
    <div class="faq">
      <div class="item"><div class="bar"></div><div class="square"></div></div>
      <div class="item"><div class="bar w80"></div><div class="square"></div></div>
      <div class="item"><div class="bar"></div><div class="square"></div></div>
      <div class="item"><div class="bar w60"></div><div class="square"></div></div>
    </div>
    <div class="final">
      <div class="bar h2" style="width:50%;background:var(--block-dark)"></div>
      <div class="bar w40" style="background:#fff"></div>
      <div class="btn lg"></div>
    </div>
  </div>
</section>

<!-- 8. FOOTER -->
<footer>
  <div class="wrap">
    <div class="row c4">
      <div class="stack"><div class="bar h2 w60"></div><div class="bar"></div><div class="bar w80"></div></div>
      <div class="stack"><div class="bar w60"></div><div class="bar"></div><div class="bar w80"></div></div>
      <div class="stack"><div class="bar w60"></div><div class="bar"></div><div class="bar w80"></div></div>
      <div class="stack"><div class="bar w60"></div><div class="strip"><span class="circle sm"></span><span class="circle sm"></span><span class="circle sm"></span></div></div>
    </div>
  </div>
</footer>

<div class="float"></div>

</body>
</html>
